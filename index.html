@import url('https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;500;600;700;800&display=swap');
:root{
  color-scheme:light;
  --bg:#f5ead8; --surface:#fffaf3; --surface2:#ebddc5; --text:#201e1d; --muted:#82796a;
  --border:rgba(32,30,29,.14); --primary:#c67139; --primary-ink:#fff7ea; --primary-strong:#8c491a;
  --pagado:#7a8a5e; --pendiente:#d67f48; --noaplica:#c0b6a5;
  --shadow:0 1px 2px rgba(46,43,37,.10),0 8px 24px rgba(46,43,37,.10);
  --font-heading:"Caprasimo",Georgia,serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:32px; --r-md:20px; --r-sm:14px;
  --c-vivienda:#b2622d; --c-servicios:#8fa073; --c-suscripciones:#d9a94a; --c-salud:#728157;
  --c-tarjetas:#a35a4a; --c-alimentacion:#f6a06b; --c-mascotas:#ccdbb2; --c-ahorro:#c0b6a5;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#2a2721; --surface:#3a362e; --surface2:#474238; --text:#f9f4ed; --muted:#c0b6a5;
  --border:rgba(249,244,237,.16); --primary:#f6a06b; --primary-ink:#402310; --primary-strong:#ffc6a5;
  --pagado:#aebf92; --pendiente:#f6a06b; --noaplica:#82796a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{zoom:.85}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:400;letter-spacing:-.015em}
a{color:var(--primary)}
a:hover{color:var(--primary-strong)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--primary) 30%,transparent)}
.app-header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.app-header .htitle{flex:1;min-width:0}
.app-header h1{font-family:var(--font-heading);font-size:21px;margin:0;font-weight:400;letter-spacing:-.01em}
.app-header .sub{font-size:12px;color:var(--muted);font-weight:600}
.iconbtn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:42px;height:42px;
  border-radius:50%;font-size:18px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:background .15s}
.iconbtn:hover{background:color-mix(in srgb,var(--primary) 12%,var(--surface))}
.iconbtn:active{background:color-mix(in srgb,var(--primary) 22%,var(--surface))}
main{padding:16px;max-width:680px;margin:0 auto}
.screen{display:none;animation:fade .2s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.section-title{font-family:var(--font-body);font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:22px 6px 10px}
.section-title:first-child{margin-top:0}
.balance-card{background:var(--primary);color:var(--primary-ink);border:none;
  border-radius:var(--r-lg);padding:22px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.balance-card::after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.13)}
.balance-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;opacity:.85;position:relative}
.balance-card .title{font-family:var(--font-heading);font-size:34px;font-weight:400;margin:6px 0;line-height:1.05;position:relative}
.balance-card .meta{font-size:14px;opacity:.92;position:relative}
.balance-card .progress-track{background:rgba(0,0,0,.16);border:none}
.balance-card .progress-fill{background:var(--primary-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:999px;
  padding:11px 18px;font-family:var(--font-heading);font-weight:400;font-size:14.5px;cursor:pointer;transition:background .15s,color .15s}
.btn-light{background:rgba(255,255,255,.22);color:#fff}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 84%,#000)}
.btn-primary:active{background:var(--primary-strong)}

<script>
const SEED = JSON.parse(document.getElementById('seed').textContent);
const MONTHS_FULL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const PALETTE=[
  {name:'Terracota',hex:'#b2622d'},{name:'Arcilla',hex:'#a35a4a'},{name:'Durazno',hex:'#f6a06b'},
  {name:'Ocre',hex:'#d9a94a'},{name:'Salvia',hex:'#8fa073'},{name:'Salvia oscura',hex:'#728157'},
  {name:'Salvia clara',hex:'#ccdbb2'},{name:'Arena',hex:'#c0b6a5'},{name:'Musgo',hex:'#56633f'},
  {name:'Crema',hex:'#eee7db'},{name:'Canela',hex:'#8c491a'},{name:'Oliva',hex:'#aebf92'}
];
const money=n=> (n===null||n===undefined||n==='')? null : '$'+Math.round(n).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){return 'id'+Math.random().toString(36).slice(2,10)}
function periodLabel(p){const [y,m]=p.split('-').map(Number);return MONTHS_FULL[m-1][0].toUpperCase()+MONTHS_FULL[m-1].slice(1)+' '+y}
function addMonth(p){let [y,m]=p.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')}
function copy(t){if(!t)return;navigator.clipboard&&navigator.clipboard.writeText(t);toast('Copiado')}
function toast(m){const d=document.createElement('div');d.textContent=m;
  d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:99;box-shadow:var(--shadow)';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

// ====== SEED DE DATOS DE EJEMPLO (registros mensuales + ingresos) ======
// Importante: los montos de "montoBase" son los mismos que figuran en el Excel de Lucas.
// No se inventan variaciones mes a mes: cada mes repite el mismo monto base (tal cual pasa hoy en
// el Excel, donde el valor se pisa y queda igual hasta que Lucas lo cambia a mano).
// Arrancamos con solo dos meses (Julio y Agosto 2026), que es el punto real donde está hoy Lucas:
// Julio ya cerrado (todo pagado) y Agosto en curso (todo pendiente, para que lo vaya marcando él).
// El sueldo se replica igual (3.000.000, el único valor que figura en el Excel) en ambos meses.
function buildSeedData(){
  const periodos=['2026-07','2026-08'];
  const registros=[];
  SEED.gastos.forEach(g=>{
    periodos.forEach((p,i)=>{
      const monto = g.tipoMonto==='variable' ? null : g.montoBase;
      const estado = i===0 ? 'pagado' : 'pendiente'; // Julio cerrado, Agosto por marcar
      registros.push({id:uid(),gastoId:g.id,periodo:p,monto:monto,estado:estado,fechaEstado:null});
    });
  });
  const ingresos=periodos.map(p=>({periodo:p,concepto:'Sueldo',monto:3000000}));
  return {periodos,registros,ingresos};
}

// ====== PERSISTENCIA LOCAL ======
const store={
  get(k,d){try{const v=localStorage.getItem('pg_'+k);return v===null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem('pg_'+k,JSON.stringify(v))}catch(e){toast('Almacenamiento lleno')}}
};
// SEED_VERSION: subir este número fuerza a recargar los datos de ejemplo (y el PIN por defecto)
// aunque el navegador ya tuviera datos guardados de una versión anterior del prototipo.
const SEED_VERSION=5;
let seedData=null;
if(store.get('seedVersion',0)!==SEED_VERSION){
  seedData=buildSeedData();
  store.set('categorias',SEED.categorias);
  store.set('gastos',SEED.gastos);
  store.set('accesosExtra',SEED.accesosExtra);
  store.set('registros',seedData.registros);
  store.set('ingresos',seedData.ingresos);
  store.set('periodos',seedData.periodos);
  store.set('viewPeriodo',seedData.periodos[seedData.periodos.length-1]);
  store.set('pin','1928');
  store.set('theme','light');
  store.set('seedVersion',SEED_VERSION);
}
let state={
  categorias:store.get('categorias',[]),
  gastos:store.get('gastos',[]),
  accesosExtra:store.get('accesosExtra',[]),
  registros:store.get('registros',[]),
  ingresos:store.get('ingresos',[]),
  periodos:store.get('periodos',[]),
  viewPeriodo:store.get('viewPeriodo',''),
  pin:store.get('pin','1928'),

// ====== CÁLCULOS ======
function totalesPeriodo(periodo){
  const regs=registrosDe(periodo).filter(r=>r.estado!=='no_aplica');
  const total=regs.reduce((a,r)=>a+(r.monto||0),0);
  const pagado=regs.filter(r=>r.estado==='pagado').reduce((a,r)=>a+(r.monto||0),0);
  const pendiente=total-pagado;
  const cantTotal=regs.length, cantPagados=regs.filter(r=>r.estado==='pagado').length;
  const ingreso=ingresoDe(periodo)?.monto||0;
  return {total,pagado,pendiente,cantTotal,cantPagados,ingreso,balance:ingreso-total};
}
function porCategoria(periodo){
  const regs=registrosDe(periodo).filter(r=>r.estado!=='no_aplica');
  const acc={};
  regs.forEach(r=>{
    const g=gastoOf(r.gastoId);if(!g)return;
    if(!acc[g.categoriaId]) acc[g.categoriaId]={monto:0,detalle:[]};
    acc[g.categoriaId].monto+=(r.monto||0);
    acc[g.categoriaId].detalle.push({nombre:g.nombre,monto:r.monto,tipoMonto:g.tipoMonto});
  });
  return Object.entries(acc).map(([catId,v])=>({catId,monto:v.monto,detalle:v.detalle,cat:catOf(catId)})).sort((a,b)=>b.monto-a.monto);
}
function prevPeriodo(periodo){const idx=state.periodos.indexOf(periodo);return idx>0?state.periodos[idx-1]:null}
function variacion(actual,anterior){if(!anterior)return null;if(anterior===0)return null;return ((actual-anterior)/anterior*100)}

function monthNav(periodo,onPrev,onNext){
  const idx=state.periodos.indexOf(periodo);
  const hasPrev=idx>0, hasNext=idx<state.periodos.length-1;
  return `<div class="month-nav">
    <button class="iconbtn" ${hasPrev?'':'disabled style="opacity:.3"'} onclick="${onPrev}">‹</button>
    <div class="lab">${periodLabel(periodo)}</div>
    <button class="iconbtn" ${hasNext?'':'disabled style="opacity:.3"'} onclick="${onNext}">›</button>
  </div>`;
}
function cambiarMesResumen(dir){
  const idx=state.periodos.indexOf(state.viewPeriodo)+dir;
  if(idx<0||idx>=state.periodos.length)return;
  state.viewPeriodo=state.periodos[idx];save();render();
}
function renderResumen(){
  const p=state.viewPeriodo;
  const t=totalesPeriodo(p);
  const pctSueldo=t.ingreso? Math.round(t.total/t.ingreso*100):0;
  const prevP=prevPeriodo(p);
  const tPrev=prevP?totalesPeriodo(prevP):null;
  const varTotal=tPrev?variacion(t.total,tPrev.total):null;
  const progreso=t.cantTotal? Math.round(t.cantPagados/t.cantTotal*100):0;
  let html=monthNav(p,'cambiarMesResumen(-1)','cambiarMesResumen(1)');
  html+=`<div class="balance-card">
    <div class="label">Balance del mes</div>
    <div class="title">${money(t.balance)}</div>
    <div class="meta">Ingreso ${money(t.ingreso)} · Gastos ${money(t.total)}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${progreso}%"></div></div>
    <div class="meta" style="margin-top:6px">${t.cantPagados} de ${t.cantTotal} gastos pagados (${progreso}%)</div>
  </div>`;
  html+=`<div class="kpis">
    <div class="kpi"><div class="lab">Gastos totales del mes</div><div class="val">${money(t.total)}</div></div>
    <div class="kpi"><div class="lab">Pagado</div><div class="val" style="color:var(--pagado)">${money(t.pagado)}</div></div>
    <div class="kpi"><div class="lab">Pendiente</div><div class="val" style="color:var(--pendiente)">${money(t.pendiente)}</div></div>
    <div class="kpi"><div class="lab">% del ingreso</div><div class="val">${t.ingreso?pctSueldo+'%':'-'}</div></div>
  </div>`;
  if(varTotal!==null){
    html+=`<div class="note" style="margin-bottom:14px">${varTotal>=0?'🔺':'🔻'} El total de gastos ${varTotal>=0?'subió':'bajó'} ${Math.abs(varTotal).toFixed(1)}% respecto a ${periodLabel(prevP)}.</div>`;
  }
  const porCat=porCategoria(p);
  if(porCat.length){
    html+=`<div class="section-title">Distribución por categoría</div><div class="card"><div class="pie-wrap">${pieChart(porCat)}
      <div class="legend-grid">${porCat.map(c=>`<div class="li2"><span class="sw" style="background:${c.cat.color}"></span><span class="lname">${esc(c.cat.nombre)} · ${Math.round(c.monto/t.total*100)}%</span></div>`).join('')}</div></div></div>`;
  }
  html+=`<div class="section-title">Gastos del mes</div><div class="card">
    <div class="estado-legend">
      <span class="ekey"><span class="sw" style="background:var(--pagado)"></span>Pagado</span>
      <span class="ekey"><span class="sw" style="background:var(--pendiente)"></span>Pendiente</span>
      <span class="ekey"><span class="sw" style="background:var(--noaplica)"></span>No aplica</span>
    </div>
    ${barChartGastos(p)}
  </div>`;
  html+=`<div class="row" style="margin-top:4px">
    <button class="btn btn-ghost" style="flex:1" onclick="navTo('gastos')">💸 Gastos del mes</button>
    <button class="btn btn-ghost" style="flex:1" onclick="navTo('historico')">📈 Ver histórico</button>
  </div>`;
  document.getElementById('scr-resumen').innerHTML=html;
}
function barChartGastos(periodo){
  const items=gastosActivos().map(g=>({g,r:registro(g.id,periodo)})).filter(x=>x.r);
  if(!items.length) return `<div class="muted small">Sin gastos cargados este mes.</div>`;
  const max=Math.max(1,...items.map(x=>x.r.monto||0));
  return items.map(({g,r})=>{
    const val=r.monto||0;
    let w,displayVal;
    if(r.estado==='no_aplica'){ w=6; displayVal='No aplica'; }
    else { w=Math.max(3,Math.round(val/max*100)); displayVal=money(r.monto) ?? (g.tipoMonto==='variable'?'Variable':'-'); }
    return `<div class="barrow" onclick="abrirDetalleGasto('${g.id}')">
      <div class="barrow-label">${esc(g.nombre)}</div>
      <div class="barrow-track"><div class="barrow-fill bf-${r.estado}" style="width:${w}%"></div></div>
      <div class="barrow-val">${displayVal}</div>
    </div>`;
  }).join('');
}
function polarPt(cx,cy,r,angleDeg){const a=angleDeg*Math.PI/180;return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)};}
function pieSlicePath(cx,cy,r,startAngle,endAngle){
  const s=polarPt(cx,cy,r,startAngle), e=polarPt(cx,cy,r,endAngle);
  const largeArc=(endAngle-startAngle)>180?1:0;
  return `M${cx},${cy} L${s.x.toFixed(2)},${s.y.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${e.x.toFixed(2)},${e.y.toFixed(2)} Z`;
}
let PIE_TIP_DATA=[];
function pieChart(items){
  PIE_TIP_DATA=items;
  const total=items.reduce((a,x)=>a+x.monto,0);
  const cx=100,cy=100,r=92,gap=total?Math.min(2.5,360/items.length/6):0;
  let angle=-90;
  const slices=items.map((x,i)=>{
    const sweep=total? x.monto/total*360:0;
    const start=angle+gap/2, end=angle+sweep-gap/2;
    angle+=sweep;
    if(end<=start) return '';
    const pct=total?Math.round(x.monto/total*100):0;
    const tituloHover=`${x.cat.nombre} (${pct}%): `+x.detalle.map(d=>`${d.nombre} ${money(d.monto)??(d.tipoMonto==='variable'?'Variable':'-')}`).join(', ');
    return `<path d="${pieSlicePath(cx,cy,r,start,end)}" fill="${x.cat.color}" class="pie-slice"
      onclick="pieTooltipAt(${i},event)"><title>${esc(tituloHover)}</title></path>`;
  }).join('');
  return `<svg width="200" height="200" viewBox="0 0 200 200" style="flex:0 0 auto">${slices}</svg>`;
}
function pieTooltipAt(i,ev){
  const x=PIE_TIP_DATA[i]; if(!x) return;
  const total=PIE_TIP_DATA.reduce((a,y)=>a+y.monto,0);
  const pct=total?Math.round(x.monto/total*100):0;
  const filas=x.detalle.slice().sort((a,b)=>(b.monto||0)-(a.monto||0)).map(d=>
    `<div class="flex-between" style="padding:3px 0;gap:10px"><span>${esc(d.nombre)}</span><span style="font-weight:700;white-space:nowrap">${money(d.monto)??(d.tipoMonto==='variable'?'Variable':'-')}</span></div>`
  ).join('');
  pieTooltip(`${esc(x.cat.nombre)} · ${money(x.monto)} (${pct}%)`,filas,ev);
}
let PIE_TIP_OUTSIDE_HANDLER=null;
function pieTooltip(titulo,filasHtml,ev){
  const old=document.getElementById('pieTip'); if(old) old.remove();
  if(PIE_TIP_OUTSIDE_HANDLER){ document.removeEventListener('click',PIE_TIP_OUTSIDE_HANDLER,true); PIE_TIP_OUTSIDE_HANDLER=null; }
  const d=document.createElement('div');
  d.id='pieTip';
  d.innerHTML=`<b style="color:var(--primary-ink)">${titulo}</b><div style="margin-top:6px;max-height:160px;overflow-y:auto">${filasHtml}</div>`;
  const W=200;
  const px=ev&&typeof ev.clientX==='number'?ev.clientX:window.innerWidth/2;
  const py=ev&&typeof ev.clientY==='number'?ev.clientY:window.innerHeight/2;
  let left=px+14; if(left+W+12>window.innerWidth) left=px-W-14; if(left<12) left=12;
  let top=py-10;
  d.style.cssText=`position:fixed;left:${left}px;top:${top}px;width:${W}px;max-width:calc(100vw - 24px);background:var(--primary-strong);color:var(--primary-ink);`+
    'border:none;padding:10px 12px;border-radius:14px;font-size:11.5px;z-index:99;box-shadow:var(--shadow)';
  document.body.appendChild(d);
  const rect=d.getBoundingClientRect();
  if(rect.bottom>window.innerHeight-12) d.style.top=Math.max(12,window.innerHeight-12-rect.height)+'px';
  if(rect.top<12) d.style.top='12px';
  const cerrar=()=>{
    d.remove();
    if(PIE_TIP_OUTSIDE_HANDLER){ document.removeEventListener('click',PIE_TIP_OUTSIDE_HANDLER,true); PIE_TIP_OUTSIDE_HANDLER=null; }
  };
  d.onclick=cerrar;
  setTimeout(()=>{ if(document.getElementById('pieTip')===d) cerrar(); },6000);
  PIE_TIP_OUTSIDE_HANDLER=(e)=>{ if(!d.contains(e.target)) cerrar(); };
  setTimeout(()=>document.addEventListener('click',PIE_TIP_OUTSIDE_HANDLER,true),0);
}

// ====== GASTOS DEL MES ======
function cambiarMesGastos(dir){
  const idx=state.periodos.indexOf(state.viewPeriodo)+dir;
  if(idx<0||idx>=state.periodos.length)return;
  state.viewPeriodo=state.periodos[idx];save();render();
}
function renderGastos(){
  const p=state.viewPeriodo;
  const cats=['Todas',...state.categorias.map(c=>c.nombre)];
  const estados=['Todos','Pendiente','Pagado','No aplica'];
  let html=monthNav(p,'cambiarMesGastos(-1)','cambiarMesGastos(1)');
  html+=`<div class="chips">${cats.map(c=>`<button class="chip ${gastosFiltroCat===c?'active':''}" onclick="gastosFiltroCat='${esc(c)}';renderGastos()">${esc(c)}</button>`).join('')}</div>`;
  html+=`<div class="chips">${estados.map(e=>`<button class="chip ${gastosFiltroEstado===e?'active':''}" onclick="gastosFiltroEstado='${e}';renderGastos()">${e}</button>`).join('')}</div>`;
  let regs=registrosDe(p).map(r=>({r,g:gastoOf(r.gastoId)})).filter(x=>x.g);
  if(gastosFiltroCat!=='Todas') regs=regs.filter(x=>catOf(x.g.categoriaId).nombre===gastosFiltroCat);
  if(gastosFiltroEstado!=='Todos'){
    const map={'Pendiente':'pendiente','Pagado':'pagado','No aplica':'no_aplica'};
    regs=regs.filter(x=>x.r.estado===map[gastosFiltroEstado]);
  }
  const ordenIdx=Object.fromEntries(state.gastos.map((g,i)=>[g.id,i]));
  regs.sort((a,b)=>ordenIdx[a.g.id]-ordenIdx[b.g.id]);
  html+=`<div class="card">`;
  if(!regs.length){
    html+=`<div class="muted" style="text-align:center;padding:20px 0">No hay gastos que coincidan con el filtro.</div>`;
  } else {
    html+=regs.map(({r,g})=>{
      const cat=catOf(g.categoriaId);
      const montoTxt = money(r.monto) ?? (g.tipoMonto==='variable'?'Variable':'-');
      const iconEstado = r.estado==='pagado'?'✓':(r.estado==='no_aplica'?'–':'');
      return `<div class="gasto-row">
        <div class="check ${r.estado}" onclick="event.stopPropagation();toggleEstado('${g.id}','${p}')">${iconEstado}</div>
        <div class="info" onclick="abrirDetalleGasto('${g.id}')">
          <div class="nombre">${esc(g.nombre)}</div>
          <div class="meta"><span style="color:${cat.color}">●</span> ${esc(cat.nombre)}</div>
          ${g.medioPago?`<div class="meta medio">💳 ${esc(g.medioPago)}${tieneAcceso(g)?` · <span class="linkacceso" onclick="event.stopPropagation();irAAcceso('${g.id}')">🔑 Ver acceso</span>`:''}</div>`:''}
        </div>
        <div class="monto" onclick="abrirDetalleGasto('${g.id}')">${montoTxt}</div>
        <button class="rowbtn" title="Editar" onclick="event.stopPropagation();abrirFormGasto('${g.id}')">✏️</button>
        <button class="rowbtn" title="Eliminar" onclick="event.stopPropagation();eliminarGasto('${g.id}')">🗑️</button>
      </div>`;
    }).join('');
  }
  html+='</div>';
  html+=`<button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="marcarTodoPagado()">✔️ Marcar todo el mes como pagado</button>`;
  html+=`<div style="height:70px"></div>`;
  document.getElementById('scr-gastos').innerHTML=html;
}
function toggleEstado(gastoId,periodo){
  const r=registro(gastoId,periodo);
  if(!r)return;
  const orden=['pendiente','pagado','no_aplica'];
  const next=orden[(orden.indexOf(r.estado)+1)%orden.length];
  r.estado=next;r.fechaEstado=null;save();render();
}
function marcarTodoPagado(){
  const p=state.viewPeriodo;
  if(!confirm(`¿Marcar todos los gastos de ${periodLabel(p)} como pagados?`))return;
  registrosDe(p).forEach(r=>{ if(r.estado!=='no_aplica') r.estado='pagado'; });
  save();renderGastos();toast('Se marcó todo '+periodLabel(p)+' como pagado');
}

// ====== TABLA (vista tipo planilla, como el Excel) ======

// ====== EXPORTAR / IMPORTAR EXCEL (tabla completa: todos los meses cargados) ======
function tablaAOA(){
  const gastos=gastosActivos();
  const filas=[['Gasto',...state.periodos.map(p=>periodLabel(p))]];
  gastos.forEach(g=>{
    const fila=[g.nombre];
    state.periodos.forEach(p=>{
      const r=registro(g.id,p);
      if(!r){ fila.push(''); return; }
      fila.push(r.monto===null||r.monto===undefined ? (g.tipoMonto==='variable'?'Variable':'') : r.monto);
    });
    filas.push(fila);
  });
  return filas;
}
function construirWorkbookExcel(){
  const ws=XLSX.utils.aoa_to_sheet(tablaAOA());
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Pagos');
  return wb;
}
function exportarExcel(){
  XLSX.writeFile(construirWorkbookExcel(),`pagos_${state.viewPeriodo}.xlsx`);
}
function importarExcel(event){
  const file=event.target.files[0];
  event.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    let wb;
    try{ wb=XLSX.read(e.target.result,{type:'array'}); }
    catch(err){ toast('No se pudo leer ese archivo'); return; }
    const ws=wb.Sheets[wb.SheetNames[0]];
    const filas=XLSX.utils.sheet_to_json(ws,{header:1});
    if(!filas.length){ toast('El archivo está vacío'); return; }
    const encabezado=filas[0];
    // Mapea cada columna (a partir de la 2°) a un período existente, comparando por su etiqueta ("Julio 2026").
    const colAPeriodo={};
    for(let c=1;c<encabezado.length;c++){
      const etiqueta=String(encabezado[c]||'').trim();
      const periodo=state.periodos.find(p=>periodLabel(p)===etiqueta);
      if(periodo) colAPeriodo[c]=periodo;
    }
    let actualizados=0, filasSinMatch=0, columnasSinMatch=encabezado.length-1-Object.keys(colAPeriodo).length;
    for(let f=1;f<filas.length;f++){
      const fila=filas[f]; if(!fila||!fila.length) continue;
      const nombre=String(fila[0]||'').trim().toLowerCase();
      const g=gastosActivos().find(x=>x.nombre.trim().toLowerCase()===nombre);
      if(!g){ if(nombre) filasSinMatch++; continue; }
      Object.entries(colAPeriodo).forEach(([c,periodo])=>{
        const celda=fila[c];
        if(celda===undefined||celda===null||celda==='') return;
        const r=registro(g.id,periodo); if(!r) return;
        if(typeof celda==='string' && celda.trim().toLowerCase()==='variable'){ r.monto=null; actualizados++; return; }
        const num=typeof celda==='number'?celda:parseFloat(String(celda).replace(/[^\d.,-]/g,'').replace(/\./g,'').replace(',','.'));
        if(!isNaN(num)){ r.monto=num; actualizados++; }
      });
    }
    save();render();
    let msg=`Se actualizaron ${actualizados} celdas.`;
    if(filasSinMatch) msg+=` ${filasSinMatch} fila(s) no coincidieron con ningún gasto.`;
    if(columnasSinMatch>0) msg+=` ${columnasSinMatch} columna(s) no coincidieron con ningún mes cargado.`;
    toast(msg);
  };
  reader.readAsArrayBuffer(file);
}

function renderHistorico(){
  const opts=[`<option value="__total__">Total general</option>`]
    .concat(state.categorias.map(c=>`<option value="cat:${c.id}">Categoría: ${esc(c.nombre)}</option>`))
    .concat(gastosActivos().map(g=>`<option value="g:${g.id}">${esc(g.nombre)}</option>`));
  let html=`<label>Ver evolución de</label><select id="histSelect" onchange="histSel=this.value;renderHistorico()">${opts.map(o=>o.replace(`value="${histSel}"`,`value="${histSel}" selected`)).join('')}</select>`;
  const series=state.periodos.map(p=>{
    if(histSel==='__total__') return totalesPeriodo(p).total;
    if(histSel.startsWith('cat:')){const catId=histSel.slice(4);return porCategoria(p).find(x=>x.catId===catId)?.monto||0;}
    const gastoId=histSel.slice(2);const r=registro(gastoId,p);return r&&r.estado!=='no_aplica'?(r.monto||0):null;
  });
  html+=`<div class="card" style="margin-top:12px">${lineChart(state.periodos,series)}</div>`;
  html+=`<div class="card" style="overflow-x:auto"><table><thead><tr><th>Mes</th><th class="num">Monto</th><th class="num">Variación</th></tr></thead><tbody>`;
  series.forEach((v,i)=>{
    const prev=i>0?series[i-1]:null;
    const varr=(prev!==null&&prev!==undefined&&prev!==0&&v!==null)?variacion(v,prev):null;
    html+=`<tr><td>${periodLabel(state.periodos[i])}</td><td class="num">${v===null?'-':money(v)}</td>
      <td class="num">${varr===null?'-':(varr>=0?'+':'')+varr.toFixed(1)+'%'}</td></tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('scr-historico').innerHTML=html;
}
function lineChart(labels,vals){
  const clean=vals.map(v=>v===null||v===undefined?0:v);
  const max=Math.max(...clean,1);
  const W=340,H=180,pl=34,pr=14,pt=24,pb=30;
  const iw=W-pl-pr, ih=H-pt-pb, n=labels.length;
  const x=i=> n<=1? pl+iw/2 : pl+ i*(iw/(n-1));
  const y=v=> pt+ ih - (v/max*ih);
  const pts=clean.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let dots='',lbls='';
  clean.forEach((v,i)=>{
    const xi=x(i), anchor = i===0?'start' : (i===n-1?'end':'middle');
    dots+=`<circle cx="${xi.toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="var(--primary)"/>`;
    lbls+=`<text x="${xi.toFixed(1)}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="${anchor}">${periodLabel(labels[i]).slice(0,3)}</text>`;
  });
  return `<svg class="line-svg" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lbls}</svg>`;
}

  const texto=resumenTexto();
  try{
    const arrayBuffer=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const file=new File([arrayBuffer],nombreArchivo,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Pagos',text:texto});
      return;
    }
  }catch(err){ /* el usuario canceló o el navegador no lo soporta: seguimos con el respaldo */ }
  exportarExcel();
  toast('Se descargó el Excel. Adjuntalo a mano en el mensaje de WhatsApp que se va a abrir.');
  window.open('https://wa.me/?text='+encodeURIComponent(texto),'_blank');
}

// ====== AJUSTES ======
function renderAjustes(){
  let h=`<div class="section-title">🔐 Seguridad</div><div class="card">
    <button class="btn btn-ghost" onclick="abrirCambioPin()">Cambiar PIN</button>
    <div class="note">El PIN es una traba simple para que nadie entre "de casualidad" si toma tu celular. No reemplaza el bloqueo del propio equipo, y las contraseñas de pago quedan visibles en texto dentro de la app.</div></div>`;
  h+=`<div class="section-title">📅 Meses</div><div class="card">
    <div class="muted small" style="margin-bottom:8px">Mes activo: <b>${periodLabel(state.periodos[state.periodos.length-1])}</b></div>
    <button class="btn btn-primary" onclick="avanzarMes()">Agregar mes siguiente</button>
    <div class="note">Copia todos los gastos activos al nuevo mes en estado "Pendiente", igual que hoy pasa a mano en el Excel.</div></div>`;
  h+=`<div class="section-title">🏷️ Categorías</div><div class="card">${state.categorias.map(c=>`
    <div class="row" style="margin:8px 0">
      <span style="width:16px;height:16px;border-radius:5px;background:${c.color};flex:0 0 auto;border:1px solid var(--border)"></span>
      <span style="flex:1">${esc(c.nombre)}</span>
      <select style="width:auto;margin:0" onchange="cambiarColorCategoria('${c.id}',this.value)">
        ${PALETTE.map(pl=>`<option value="${pl.hex}" ${c.color===pl.hex?'selected':''}>${pl.name}</option>`).join('')}
      </select>
    </div>`).join('')}</div>`;
  h+=`<div class="card"><button class="btn btn-ghost" style="width:100%" onclick="if(confirm('¿Reiniciar todos los datos?')){Object.keys(localStorage).filter(k=>k.startsWith('pg_')).forEach(k=>localStorage.removeItem(k));location.reload();}">Reiniciar datos</button></div>`;
  document.getElementById('scr-ajustes').innerHTML=h;
}
function cambiarColorCategoria(catId,hex){
  const c=state.categorias.find(x=>x.id===catId);
  if(!c)return;
  c.color=hex;save();renderAjustes();toast('Color actualizado');
}
function avanzarMes(){
  const ultimo=state.periodos[state.periodos.length-1];
  const nuevo=addMonth(ultimo);
  if(state.periodos.includes(nuevo))return toast('Ese mes ya existe');
  gastosActivos().forEach(g=>{
    state.registros.push({id:uid(),gastoId:g.id,periodo:nuevo,monto:g.tipoMonto==='fijo'?g.montoBase:null,estado:'pendiente',fechaEstado:null});
  });
  const ultIngreso=ingresoDe(ultimo);
  state.ingresos.push({periodo:nuevo,concepto:'Sueldo',monto:ultIngreso?ultIngreso.monto:0});
  state.periodos.push(nuevo);
  state.viewPeriodo=nuevo;
  save();renderAjustes();toast('Se agregó '+periodLabel(nuevo));
}
function abrirCambioPin(){
  let h=`<h3>Cambiar PIN</h3>
    <label>PIN actual</label><input id="pinActual" type="password" inputmode="numeric" maxlength="4">
    <label>PIN nuevo (4 dígitos)</label><input id="pinNuevo" type="password" inputmode="numeric" maxlength="4">
    <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="cambiarPin()">Guardar</button>`;
  openSheet(h);
}
function cambiarPin(){
  const actual=document.getElementById('pinActual').value;
  const nuevo=document.getElementById('pinNuevo').value;
  if(actual!==state.pin)return toast('El PIN actual no coincide');
  if(!/^\d{4}$/.test(nuevo))return toast('El PIN nuevo debe tener 4 números');
  state.pin=nuevo;save();history.back();toast('PIN actualizado');
}

// ====== TEMA ======
function applyTheme(){document.body.dataset.theme=state.theme;document.getElementById('themeBtn').textContent=state.theme==='dark'?'☀️':'🌙';
  document.querySelector('meta[name=theme-color]').setAttribute('content',state.theme==='dark'?'#2a2721':'#f5ead8')}
document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();applyTheme()};

// ====== DISPATCHER ======
function render(){
  switch(current){
    case 'resumen':renderResumen();break;
    case 'gastos':renderGastos();break;
    case 'tabla':renderTabla();break;
    case 'historico':renderHistorico();break;
    case 'ingresos':renderIngresos();break;
    case 'accesos':renderAccesos();break;
    case 'compartir':renderCompartir();break;
    case 'ajustes':renderAjustes();break;
  }
}
applyTheme();
history.replaceState({screen:'resumen'},'','#resumen');
go('resumen',false);
// Registra el service worker solo cuando la app está alojada en un servidor real (http/https),
// no cuando se abre como archivo local. Es lo que le falta para instalarse como app en Android.
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
